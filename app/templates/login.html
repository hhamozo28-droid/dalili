{% extends "base.html" %}
{% block title %}دخول{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <div class="login-icon">🔐</div>
        <h1 class="login-title">dalili</h1>
        <p class="login-subtitle">لوحة الأساتذة — التكوين المهني</p>

        {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

        <form method="POST" action="/login" class="login-form">
            <div class="field">
                <label>رمز الدخول</label>
                <div class="input-wrap">
                    <input type="password" id="passcode" name="code" placeholder="أدخل رمز الدخول" autofocus required>
                    <button type="button" id="togglePass" class="toggle-btn" aria-label="إظهار أو إخفاء رمز الدخول">
                        <svg class="icon-eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-block">دخول</button>
        </form>
        <p class="login-note">رمز الدخول يُستخدم مرة واحدة فقط</p>
    </div>
</div>
{% endblock %}
